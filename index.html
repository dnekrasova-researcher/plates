<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тарелка дня</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E9EDE4">

<!-- iOS standalone support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Тарелка">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #E9EDE4;
    --surface: #FBFAF6;
    --ink: #262B22;
    --ink-soft: #6B7060;
    --line: #D7DBCA;
    --veg: #5B7B4F;
    --veg-soft: #DCE5D4;
    --protein: #9A4B2A;
    --protein-soft: #EAD9CD;
    --carb: #C9973B;
    --carb-soft: #F1E3C4;
    --training: #B5592E;
    --rest: #4E6E86;
    --radius: 18px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
    -webkit-tap-highlight-color: transparent;
  }
  .app{
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 18px 60px;
  }
  .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 30px;
    margin: 2px 0 18px;
    letter-spacing: -0.01em;
  }

  /* week strip */
  .week{
    display:flex;
    gap: 6px;
    margin-bottom: 18px;
  }
  .day-btn{
    flex:1;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px 0 6px;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .day-btn .num{
    display:block;
    font-family: 'Fraunces', serif;
    font-size: 16px;
    color: var(--ink);
    margin-top: 2px;
  }
  .day-btn.active{
    background: var(--ink);
    border-color: var(--ink);
  }
  .day-btn.active, .day-btn.active .num{ color: #F5F3EA; }
  .day-btn .dot{
    width:4px; height:4px; border-radius:50%;
    background: var(--veg); margin: 4px auto 0;
    opacity: 0;
  }
  .day-btn .dot.show{ opacity: 1; }

  /* segmented toggle */
  .toggle{
    display:flex;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 22px;
  }
  .toggle button{
    flex:1;
    border: none;
    background: transparent;
    padding: 10px 0;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: var(--ink-soft);
    border-radius: 10px;
    cursor: pointer;
  }
  .toggle button.active[data-type="training"]{ background: var(--training); color: #fff; }
  .toggle button.active[data-type="rest"]{ background: var(--rest); color: #fff; }

  /* plate */
  .plate-wrap{
    display:flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 24px;
  }
  svg.plate{ width: 220px; height: 220px; }
  .plate-caption{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 10px;
    text-align: center;
    line-height: 1.6;
  }
  .legend{
    display:flex;
    gap: 14px;
    margin-top: 8px;
  }
  .legend span{ display:flex; align-items:center; gap: 5px; font-size: 11px; color: var(--ink-soft); font-family:'IBM Plex Mono', monospace;}
  .legend i{ width:8px; height:8px; border-radius:2px; display:inline-block; }

  /* meal cards */
  .meal{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow: hidden;
  }
  .meal-head{
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 16px 18px;
    cursor: pointer;
  }
  .meal-title{
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 500;
    display:flex;
    align-items:center;
    gap: 10px;
  }
  .meal-check-count{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
  }
  .chevron{
    font-size: 13px;
    color: var(--ink-soft);
    transition: transform 0.2s ease;
  }
  .meal.open .chevron{ transform: rotate(180deg); }
  .meal-body{
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease;
  }
  .meal.open .meal-body{ max-height: 600px; }
  .meal-body-inner{
    padding: 0 18px 18px;
  }
  .checks{
    display:flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .chip{
    display:flex;
    align-items:center;
    gap: 7px;
    padding: 9px 14px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    font-size: 13px;
    font-weight: 600;
    background: transparent;
    cursor: pointer;
    color: var(--ink-soft);
  }
  .chip .box{
    width: 15px; height:15px; border-radius:4px;
    border: 1.5px solid currentColor;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .chip .box::after{
    content:'';
    width:7px; height:7px;
    border-radius:2px;
    background: currentColor;
    opacity: 0;
  }
  .chip.checked .box::after{ opacity:1; }
  .chip[data-kind="veg"].checked{ background: var(--veg-soft); border-color: var(--veg); color: var(--veg); }
  .chip[data-kind="protein"].checked{ background: var(--protein-soft); border-color: var(--protein); color: var(--protein); }
  .chip[data-kind="carb"].checked{ background: var(--carb-soft); border-color: var(--carb); color: var(--carb); }

  .row{ display:flex; gap: 10px; margin-bottom: 10px; }
  .photo-btn, .note-wrap{ flex:1; }
  .photo-btn label{
    display:flex; align-items:center; justify-content:center; gap:6px;
    border: 1.5px dashed var(--line);
    border-radius: 12px;
    height: 84px;
    font-size: 12px;
    color: var(--ink-soft);
    cursor:pointer;
    font-weight: 600;
  }
  .photo-preview{
    position: relative;
    height: 84px;
    border-radius: 12px;
    overflow: hidden;
  }
  .photo-preview img{ width:100%; height:100%; object-fit: cover; display:block; }
  .photo-preview .remove{
    position:absolute; top:5px; right:5px;
    background: rgba(38,43,34,0.75);
    color:#fff; border:none; border-radius:50%;
    width:22px; height:22px; font-size:13px; line-height:1;
    cursor:pointer;
  }
  textarea{
    width: 100%;
    height: 84px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    resize: none;
    color: var(--ink);
    background: #fff;
  }
  textarea::placeholder{ color: #A9AE9A; }
  input[type=file]{ display:none; }

  .status{
    text-align:center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 10px;
    min-height: 16px;
  }
  .reset-link{
    display:block;
    text-align:center;
    margin-top: 26px;
    font-size: 12px;
    color: var(--ink-soft);
    text-decoration: underline;
    background:none; border:none; cursor:pointer;
    width: 100%;
  }
</style>
</head>
<body>
<div class="app">
  <div class="eyebrow" id="monthLabel">—</div>
  <h1>Тарелка дня</h1>

  <div class="week" id="weekStrip"></div>

  <div class="toggle" id="typeToggle">
    <button data-type="training">Тренировка</button>
    <button data-type="rest">Отдых</button>
  </div>

  <div class="plate-wrap">
    <svg class="plate" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="92" fill="none" stroke="var(--line)" stroke-width="1"/>
      <path id="wedgeVeg" fill="var(--veg-soft)"/>
      <path id="wedgeProtein" fill="var(--protein-soft)"/>
      <path id="wedgeCarb" fill="var(--carb-soft)"/>
      <circle cx="100" cy="100" r="92" fill="none" stroke="var(--ink)" stroke-opacity="0.06" stroke-width="1"/>
    </svg>
    <div class="legend">
      <span><i style="background:var(--veg)"></i>овощи</span>
      <span><i style="background:var(--protein)"></i>белок</span>
      <span><i style="background:var(--carb)"></i>угли</span>
    </div>
    <div class="plate-caption" id="plateCaption">Отмечайте приёмы пищи — тарелка заполняется</div>
  </div>

  <div id="meals"></div>

  <div class="status" id="statusLine">&nbsp;</div>
  <button class="reset-link" id="resetBtn">Очистить этот день</button>
</div>

<script>
const MEAL_DEFS = [
  { key: 'breakfast', title: 'Завтрак', kinds: ['protein','carb'] },
  { key: 'lunch',     title: 'Обед',     kinds: ['veg','protein','carb'] },
  { key: 'snack',     title: 'Перекус',  kinds: ['protein'] },
  { key: 'dinner',    title: 'Ужин',     kinds: ['veg','protein','carb'] },
];
const KIND_LABEL = { veg: 'Овощи ½', protein: 'Белок ¼', carb: 'Угли ¼' };
const WEEKDAYS = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

let currentDate = new Date();
let currentKey = dateKey(currentDate);
let state = null; // { dayType, meals: {...} }

function dateKey(d){
  return d.toISOString().slice(0,10);
}
function startOfWeek(d){
  const day = (d.getDay() + 6) % 7; // Monday = 0
  const s = new Date(d);
  s.setDate(d.getDate() - day);
  return s;
}
function emptyState(){
  const meals = {};
  MEAL_DEFS.forEach(m => {
    const kinds = {};
    m.kinds.forEach(k => kinds[k] = false);
    meals[m.key] = { checks: kinds, photo: null, note: '' };
  });
  return { dayType: 'training', meals };
}

function setStatus(text, isError){
  const el = document.getElementById('statusLine');
  el.textContent = text;
  el.style.color = isError ? '#B5592E' : '';
  if(text) setTimeout(() => { if(el.textContent === text) el.textContent = '\u00A0'; }, 1800);
}

async function loadDay(key){
  try{
    const raw = localStorage.getItem('plate:' + key);
    state = raw ? JSON.parse(raw) : emptyState();
  }catch(e){
    state = emptyState();
  }
  render();
}

async function saveDay(){
  try{
    localStorage.setItem('plate:' + currentKey, JSON.stringify(state));
  }catch(e){
    setStatus('Ошибка сохранения — возможно, закончилось место', true);
  }
}

function renderWeekStrip(){
  const strip = document.getElementById('weekStrip');
  strip.innerHTML = '';
  const monday = startOfWeek(currentDate);
  for(let i=0;i<7;i++){
    const d = new Date(monday);
    d.setDate(monday.getDate()+i);
    const key = dateKey(d);
    const btn = document.createElement('div');
    btn.className = 'day-btn' + (key === currentKey ? ' active' : '');
    btn.innerHTML = `${WEEKDAYS[i]}<span class="num">${d.getDate()}</span><span class="dot"></span>`;
    btn.addEventListener('click', () => {
      currentDate = d;
      currentKey = key;
      loadDay(currentKey);
    });
    strip.appendChild(btn);
    checkDayHasData(key, btn.querySelector('.dot'));
  }
  document.getElementById('monthLabel').textContent =
    currentDate.getDate() + ' ' + MONTHS[currentDate.getMonth()] + ', ' + WEEKDAYS[(currentDate.getDay()+6)%7];
}

async function checkDayHasData(key, dotEl){
  try{
    const raw = localStorage.getItem('plate:' + key);
    if(raw){
      const s = JSON.parse(raw);
      const any = Object.values(s.meals).some(m => Object.values(m.checks).some(Boolean) || m.photo || m.note);
      if(any) dotEl.classList.add('show');
    }
  }catch(e){ /* no data yet, fine */ }
}

function renderToggle(){
  const btns = document.querySelectorAll('#typeToggle button');
  btns.forEach(b => b.classList.toggle('active', b.dataset.type === state.dayType));
}

function renderPlate(){
  const veg = countProgress('veg');
  const protein = countProgress('protein');
  const carb = countProgress('carb');

  drawWedge('wedgeVeg', 0, 180, veg);
  drawWedge('wedgeProtein', 180, 270, protein);
  drawWedge('wedgeCarb', 270, 360, carb);

  const caption = document.getElementById('plateCaption');
  const total = veg + protein + carb;
  if(total === 0){
    caption.textContent = 'Отмечайте приёмы пищи — тарелка заполняется';
  } else if(veg < 0.5){
    caption.textContent = 'Овощей пока маловато на сегодня';
  } else {
    caption.textContent = state.dayType === 'training'
      ? 'Тренировочный день — норм подкрепиться углеводами'
      : 'День отдыха — держим тарелку полегче';
  }
}

function countProgress(kind){
  let checked = 0, possible = 0;
  MEAL_DEFS.forEach(m => {
    if(m.kinds.includes(kind)){
      possible++;
      if(state.meals[m.key].checks[kind]) checked++;
    }
  });
  return possible ? checked/possible : 0;
}

function polarToCartesian(cx, cy, r, angleDeg){
  const a = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
}
function describeSector(cx, cy, r, startAngle, endAngle){
  const start = polarToCartesian(cx, cy, r, endAngle);
  const end = polarToCartesian(cx, cy, r, startAngle);
  const largeArc = endAngle - startAngle <= 180 ? 0 : 1;
  return `M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${largeArc} 0 ${end.x} ${end.y} Z`;
}
function drawWedge(id, startAngle, endAngle, progress){
  const el = document.getElementById(id);
  const minR = 30, maxR = 90;
  const r = minR + (maxR - minR) * progress;
  el.setAttribute('d', describeSector(100, 100, r, startAngle, endAngle));
  el.style.transition = 'd 0.3s ease';
}

function renderMeals(){
  const wrap = document.getElementById('meals');
  wrap.innerHTML = '';
  MEAL_DEFS.forEach(def => {
    const m = state.meals[def.key];
    const doneCount = Object.values(m.checks).filter(Boolean).length;
    const totalCount = def.kinds.length;

    const card = document.createElement('div');
    card.className = 'meal';
    card.innerHTML = `
      <div class="meal-head">
        <div class="meal-title">${def.title}</div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="meal-check-count">${doneCount}/${totalCount}</span>
          <span class="chevron">▾</span>
        </div>
      </div>
      <div class="meal-body">
        <div class="meal-body-inner">
          <div class="checks">
            ${def.kinds.map(k => `
              <button class="chip ${m.checks[k] ? 'checked' : ''}" data-meal="${def.key}" data-kind="${k}">
                <span class="box"></span>${KIND_LABEL[k]}
              </button>
            `).join('')}
          </div>
          <div class="row">
            <div class="photo-btn" data-meal="${def.key}">
              ${m.photo
                ? `<div class="photo-preview"><img src="${m.photo}"><button class="remove" data-meal="${def.key}">✕</button></div>`
                : `<label>📷 Фото тарелки<input type="file" accept="image/*" capture="environment" data-meal="${def.key}"></label>`
              }
            </div>
            <div class="note-wrap">
              <textarea placeholder="Заметка (необязательно)" data-meal="${def.key}">${m.note}</textarea>
            </div>
          </div>
        </div>
      </div>
    `;
    wrap.appendChild(card);

    card.querySelector('.meal-head').addEventListener('click', () => {
      card.classList.toggle('open');
    });

    card.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', (e) => {
        e.stopPropagation();
        const meal = chip.dataset.meal, kind = chip.dataset.kind;
        state.meals[meal].checks[kind] = !state.meals[meal].checks[kind];
        renderMeals();
        renderPlate();
        saveDay();
      });
    });

    const fileInput = card.querySelector('input[type=file]');
    if(fileInput){
      fileInput.addEventListener('click', e => e.stopPropagation());
      fileInput.addEventListener('change', (e) => handlePhoto(e, def.key));
    }
    const removeBtn = card.querySelector('.remove');
    if(removeBtn){
      removeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        state.meals[def.key].photo = null;
        renderMeals();
        saveDay();
      });
    }
    const textarea = card.querySelector('textarea');
    textarea.addEventListener('click', e => e.stopPropagation());
    textarea.addEventListener('change', () => {
      state.meals[def.key].note = textarea.value;
      saveDay();
    });
  });
}

function handlePhoto(e, mealKey){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const maxW = 480;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
      state.meals[mealKey].photo = dataUrl;
      renderMeals();
      saveDay();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function render(){
  renderWeekStrip();
  renderToggle();
  renderMeals();
  renderPlate();
}

document.getElementById('typeToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if(!btn) return;
  state.dayType = btn.dataset.type;
  renderToggle();
  renderPlate();
  saveDay();
});

document.getElementById('resetBtn').addEventListener('click', async () => {
  if(!confirm('Очистить все отметки за этот день?')) return;
  state = emptyState();
  render();
  try{
    localStorage.setItem('plate:' + currentKey, JSON.stringify(state));
    setStatus('День очищен');
  }catch(e){
    setStatus('Ошибка очистки', true);
  }
});

loadDay(currentKey);

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
